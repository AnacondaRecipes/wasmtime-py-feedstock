{% set name = "wasmtime-py" %}
{% set version = "50.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bytecodealliance/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: cdc3878b39df2979867ebe69d97e5d42ca99bae9a2d3876ab167454fba5476ca

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    # remove rust because `wasmtime-py` no longer contains any Rust source (rust/ and Cargo.toml were dropped upstream),
    # it is now pure-Python ctypes bindings that bundle a prebuilt wasmtime C API library downloaded during the build:
    # https://github.com/bytecodealliance/wasmtime-py/blob/50.0.1/ci/download-wasmtime.py#L15
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - wheel
    - setuptools
    # Removed upper limit, there is only 3.0.1 version of this package for win-arm64
    - setuptools-git-versioning >=2.0
  run:
    - python

{% set ignore_tests = "" %}
# codegen tests unstable on linux
{% set ignore_tests = " --ignore=tests/codegen" %}  # [linux]
# raise RuntimeError("Could not find componentize-py executable.") which is because of missing test dependency
{% set tests_to_skip = "test_bare_funcs or test_lists or test_config" %}

test:
  source_files:
    - tests
  imports:
    - wasmtime 
  commands:
    - pip check 
    - pytest -vv -k "not ({{ tests_to_skip }})" {{ ignore_tests }}
  requires:
    - pip
    - pytest

about:
  home: https://github.com/bytecodealliance/wasmtime-py
  summary: python bindings for Wasmtime
  description: |
   The wasmtime-py package has initial support for running WebAssembly components in Python with high-level bindings. 

  license_family: Apache
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE
  dev_url: https://github.com/bytecodealliance/wasmtime-py
  doc_url: https://docs.wasmtime.dev/lang-python.html

extra:
  recipe-maintainers:
    - markw77
  skip-lints:
    - missing_test_requirement_pip
