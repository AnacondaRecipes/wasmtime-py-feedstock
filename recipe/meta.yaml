{% set name = "wasmtime-py" %}
{% set version = "50.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/bytecodealliance/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: cdc3878b39df2979867ebe69d97e5d42ca99bae9a2d3876ab167454fba5476ca
  patches:
    - patches/0001-use-conda-wasmtime.patch

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
    # Removed upper limit, there is only 3.0.1 version of this package for win-arm64
    - setuptools-git-versioning >=2.0
  run:
    - python
    - wasmtime >=50.0.0,<51.0.0

test:
  source_files:
    - tests
  imports:
    - wasmtime 
  commands:
    - pip check 
    - pytest -vv tests -k "not TestWasi and test_config"
  requires:
    - pip
    - pytest

about:
  home: https://github.com/bytecodealliance/wasmtime-py
  summary: python bindings for Wasmtime
  description: |
   The wasmtime-py package has initial support for running WebAssembly components in Python with high-level bindings. 

  license_family: Apache
  license: Apache-2.0 WITH LLVM-exception
  license_file: LICENSE
  dev_url: https://github.com/bytecodealliance/wasmtime-py
  doc_url: https://docs.wasmtime.dev/lang-python.html

extra:
  recipe-maintainers:
    - markw77
  skip-lints:
    - missing_test_requirement_pip
